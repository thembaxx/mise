name: Premium kitchen cookware — Blender review pack
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce-review-art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender authoring runtime
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Validate generator and reviewer scripts
        run: |
          python3 -m py_compile scripts/author-kitchen-cookware.py
          node --test scripts/check-kitchen-candidate.test.mjs
      - name: Author original high-detail cookware in Blender
        run: |
          blender --background --factory-startup --python-exit-code 1 \
            --python scripts/author-kitchen-cookware.py -- \
            --output-dir "$RUNNER_TEMP/mise-kitchen-review"
      - name: Validate embedded GLB, scene graph, materials, animation and provenance
        run: |
          node scripts/validate-3d-assets.mjs "$RUNNER_TEMP/mise-kitchen-review" --require-assets
          node scripts/check-kitchen-candidate.mjs "$RUNNER_TEMP/mise-kitchen-review"
      - name: Upload candidate pack — manually review before integration
        uses: actions/upload-artifact@v4
        with:
          name: mise-kitchen-premium-cookware-review
          path: ${{ runner.temp }}/mise-kitchen-review/
          retention-days: 7
          if-no-files-found: error
