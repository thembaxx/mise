name: Blender candidate art studio (manual review)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Blender and glTF exporter dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version | head -2
          /usr/bin/python3 -c "import numpy; print(numpy.__version__)"
      - name: Validate Python syntax and candidate gate tests
        run: |
          python3 -m py_compile scripts/author-blender-candidate.py
          node --test scripts/check-blender-review.test.mjs
      - name: Author original candidate models in Blender
        run: |
          blender --background --factory-startup --python-exit-code 1 --python scripts/author-blender-candidate.py -- \
            --preset dish --output-dir "$RUNNER_TEMP/blender-review"
      - name: Validate embedded web GLB size and geometry
        run: node scripts/validate-3d-assets.mjs "$RUNNER_TEMP/blender-review" --require-assets
      - name: Verify Blender animation and provenance before upload
        run: node scripts/check-blender-review.mjs dish "$RUNNER_TEMP/blender-review"
      - name: Upload unapproved review pack (no production writes)
        uses: actions/upload-artifact@v4
        with:
          name: dish-blender-review-pack
          path: ${{ runner.temp }}/blender-review/
          if-no-files-found: error
          retention-days: 7
