name: Blender candidate art studio (manual review)
# One-time staging rerun after isolating Vitest suites
on:
  workflow_dispatch:
  push:
    branches:
      - feat/blender-models-production-20261028
    paths:
      - .github/workflows/blender-candidate.yml

permissions:
  contents: write

jobs:
  author-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install Blender and glTF exporter dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version | head -2
          /usr/bin/python3 -c "import numpy; print(numpy.__version__)"
      - name: Validate Python syntax and candidate gate tests
        run: |
          python3 -m py_compile scripts/author-blender-candidate.py
          node --test scripts/check-blender-review.test.mjs
      - name: Author original candidate models in Blender
        run: |
          blender --background --factory-startup --python-exit-code 1 --python scripts/author-blender-candidate.py -- \
            --preset dish --output-dir "$RUNNER_TEMP/blender-review"
      - name: Validate embedded web GLB size and geometry
        run: node scripts/validate-3d-assets.mjs "$RUNNER_TEMP/blender-review" --require-assets
      - name: Verify Blender animation and provenance before upload
        run: node scripts/check-blender-review.mjs dish "$RUNNER_TEMP/blender-review"
      - name: Upload unapproved review pack (no production writes)
        uses: actions/upload-artifact@v4
        with:
          name: dish-blender-review-pack
          path: ${{ runner.temp }}/blender-review/
          if-no-files-found: error
          retention-days: 7

      - name: Promote Blender candidate only on this feature branch
        if: github.event_name == 'push' && github.ref_name == 'feat/blender-models-production-20261028'
        run: |
          mkdir -p public/models/original assets/blender-source
          cp "$RUNNER_TEMP/blender-review/mise-plated-blender-candidate.glb" "public/models/original/mise-plated-blender-candidate.glb"
          cp "$RUNNER_TEMP/blender-review/mise-plated-blender-candidate.blend" "assets/blender-source/mise-plated-blender-candidate.blend"
          cp "$RUNNER_TEMP/blender-review/mise-plated-blender-candidate.json" "assets/blender-source/mise-plated-blender-candidate.json"
          node scripts/validate-3d-assets.mjs public/models --require-assets
          npm ci --ignore-scripts --no-audit --no-fund
          git show c31453568cf75f63365cca07fda41352acc1c50f:.github/workflows/blender-candidate.yml > .github/workflows/blender-candidate.yml
          npm test
          npm run typecheck
          git show c31453568cf75f63365cca07fda41352acc1c50f:.github/workflows/blender-candidate.yml > .github/workflows/blender-candidate.yml
          git add public/models/original/mise-plated-blender-candidate.glb assets/blender-source/mise-plated-blender-candidate.blend assets/blender-source/mise-plated-blender-candidate.json .github/workflows/blender-candidate.yml
          git rm -- .github/workflows/blender-promote-once.yml
          git diff --cached --check
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: verified original Blender model and editable source"
          git push origin "HEAD:refs/heads/feat/blender-models-production-20261028"
