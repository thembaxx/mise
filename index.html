    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F7F6F1" />
    <style>
      :root{color-scheme:light;background:#f7f6f1}
      :root[data-theme="dark"]{color-scheme:dark;background:#111b17}
      html,body{margin:0;min-height:100%;background:inherit}
      #root{min-height:100svh}
      .mise-boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;min-height:100svh;background:inherit;color:#263226;font:600 21px system-ui,sans-serif;letter-spacing:-.035em}
      [data-theme="dark"] .mise-boot{color:#f7eed7}
      .mise-boot img{width:82px;height:82px;border-radius:22px;box-shadow:0 16px 50px #00000015}
      .mise-boot p{font:400 12px system-ui,sans-serif;letter-spacing:.08em;opacity:.62;margin:0}
    </style>
    <script>
      (function(){
        try {
          var pref=localStorage.getItem('mise:theme')||'system';
          var dark=pref==='dark'||(pref!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);
          document.documentElement.dataset.theme=dark?'dark':'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content',dark?'#111B17':'#F7F6F1');
        } catch (e) {
          document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
        }
      })();
    </script>
